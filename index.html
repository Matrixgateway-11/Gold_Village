<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f1ea" />
    <meta name="description" content="Handcrafted teak furniture from Jepara, Indonesia for refined indoor, outdoor and bathroom spaces." />
    <title>Golden Village Furniture | Handcrafted Indonesian Teak Furniture</title>
    <script>
      // The home hero photo is the largest thing painted on the home page: start downloading it
      // now instead of waiting for the JavaScript bundle to run and render the <img>.
      if (location.pathname === '/') {
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.href = '/img/uploads/2026/07/home-hero_background_image-1920x1080.webp'
        l.setAttribute('fetchpriority', 'high')
        document.head.appendChild(l)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
